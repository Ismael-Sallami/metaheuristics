# General experiment setup
SEED=42 # Fixed random seed for reproducible results.
MAX_EVALUACIONES=10000 # Stop after this number of fitness evaluations in each run.
NUM_EJECUCIONES=50 # Number of independent runs per algorithm.

# Portfolio optimization settings
LAMBDA=500.0 # Balance between Return (Profit) and Risk.

# Search algorithm settings
LS_RATIO=0.4 # Local Search from P1 changes the weight by 40%.

# Genetic algorithm settings
GA_POP_SIZE=100         # Number of chromosomes (individuals) in the population.
GA_PC_AGG=0.8           # Crossover probability for Generational GA (80%).
GA_PC_AGE=1.0           # Crossover probability for Steady-State GA (100%, always crosses).
GA_PM_INDIV=0.1         # Mutation probability per individual (10%).
GA_BLX_ALPHA=0.3        # Alpha parameter for the BLX-alpha crossover operator.
GA_MUTATION_RATIO=0.15  # Percentage of weight modified during mutation (15%).
GA_GAUSSIAN_SIGMA=0.02  # Sigma for Gaussian mutation (Volunteer/Extra implementation).

# Memetic Algorithms parameters
AM_LS_PERIOD=10         # Number of generations before applying Local Search.
AM_LS_MAX_EVALS=100     # Maximum number of evaluations allowed per Local Search application.
AM_LS_RATIO=0.15        # Soft Local Search modification ratio (15% instead of 40%).
AM_PLS_RAND=0.1         # Probability of applying Local Search to a given chromosome (AM-Rand).
# Extra parameters for custom Local Search scheduling (Volunteer/Extra work)
AM_LSCH_BASE_BUDGET=30   # Initial number of evaluations for scheduled local search.
AM_LSCH_MAX_BUDGET=200   # Maximum number of evaluations for this budget.
AM_LSCH_GROWTH=1.2       # Growth factor for the budget in each update.

# Differential evolution settings (EXTRA implementation)
DE_F=0.5                # Mutation factor.
DE_CR=0.9               # Crossover rate.
DE_POP_SIZE=100         # Population size for DE.

# Execution Flags (1 = Run, 0 = Skip)
EXP_RUN_AG_AM=1         # Run standard Genetic and Memetic Algorithms.
EXP_RUN_EXTRAS=1        # Run additional volunteer algorithms.
EXP_RUN_GAUSSIAN=1      # Run algorithms with Gaussian mutation.
EXP_RUN_LSCH=1          # Run custom Local Search scheduling.

# Dataset selection
# 0 = Use the 3 default markets (IBEX35, S&P100, S&P500)
# 1 = Use only the custom market defined below
USE_CUSTOM_MARKET=0
CUSTOM_NAME=Mercado_Prueba
CUSTOM_PATH=datos_portfolio_2526/ibex_35.csv
CUSTOM_LO=0.005
CUSTOM_HI=0.08